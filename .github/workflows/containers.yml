name: Containers

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Free space for native compiler intermediates
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            native/runtime-dependencies/pnpm-lock.yaml
            integrations/matrix/pnpm-lock.yaml
      - name: Read pinned Go version
        id: go
        run: echo "version=$(node -p 'JSON.parse(require("fs").readFileSync("native/bbctl/dependencies.json")).goVersion.slice(2)')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - uses: docker/setup-buildx-action@v4
      - name: Make Actions cache available to shell builds
        uses: actions/github-script@v8
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing ${name}`);
              if (name.endsWith('TOKEN')) core.setSecret(value);
              core.exportVariable(name, value);
            }
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'true');
      - name: Prepare pinned dependencies and clean build context
        run: bash scripts/ci/prepare-container.sh '${{ matrix.arch }}'
      - name: Resolve image name
        id: names
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build native test image
        uses: docker/build-push-action@v7
        with:
          context: .local/linux-ci-context
          file: .local/linux-ci-context/deploy/docker/Dockerfile.native
          target: service
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: threema-test:${{ matrix.arch }}
          cache-from: type=gha,scope=service-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=service-${{ matrix.arch }}
      - name: Test packaged runtime and codecs
        run: python3 scripts/ci/test-container.py 'threema-test:${{ matrix.arch }}' '${{ matrix.arch }}'
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: threema-test:${{ matrix.arch }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-${{ matrix.arch }}.txt
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scan-${{ matrix.arch }}
          path: trivy-${{ matrix.arch }}.txt
          if-no-files-found: ignore
      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested architecture with provenance and SBOM
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .local/linux-ci-context
          file: .local/linux-ci-context/deploy/docker/Dockerfile.native
          target: service
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.names.outputs.image }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=service-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

  manifest:
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Publish and verify multi-platform manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(--tag "$image:sha-${GITHUB_SHA}")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            if [[ "$tip" == "$GITHUB_SHA" ]]; then tags+=(--tag "$image:latest"); fi
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$ ]]
            tags+=(--tag "$image:${version//+/_}")
          fi
          docker buildx imagetools create "${tags[@]}" "$image:sha-${GITHUB_SHA}-amd64" "$image:sha-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "$image:sha-${GITHUB_SHA}" | tee manifest.txt
          grep -q 'Platform:.*linux/amd64' manifest.txt
          grep -q 'Platform:.*linux/arm64' manifest.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: manifest
          path: manifest.txt
          if-no-files-found: ignore
